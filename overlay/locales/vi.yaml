# Hermes static-message catalog -- Vietnamese (Tiếng Việt)
#
# Mirrors locales/en.yaml key-for-key; tests/agent/test_i18n.py asserts parity
# of both the key set and the {placeholder} tokens.
#
# Dịch thuật ngữ dùng trong file này:
#   session -> phiên          approval -> phê duyệt / cấp quyền
#   context -> ngữ cảnh       token   -> token (giữ nguyên)
#   skill   -> kỹ năng        tool    -> công cụ
#   goal    -> mục tiêu       checkpoint -> điểm khôi phục
#
# KHÔNG dịch: tên lệnh (/model, /resume…), key trong config.yaml, model id,
# provider slug, tên nền tảng, và các giá trị được code so khớp lại
# (approval.smart_deny_*_inputs, gateway.fast.status_*/label_*,
# gateway.footer.state_*) -- đó là định danh, không phải câu chữ.

approval:
  # CLI approval prompt -- shown when a dangerous command needs user review.
  # Chữ cái trong ngoặc [o]/[s]/[a]/[d] là phím người dùng bấm; code so khớp
  # cứng 'o'/'once', 's'/'session', 'a'/'always' nên phải giữ nguyên.
  dangerous_header: "⚠️  LỆNH NGUY HIỂM: {description}"
  choose_long:     "      [o] một lần  |  [s] phiên này  |  [a] luôn cho phép  |  [d] từ chối"
  choose_short:    "      [o] một lần  |  [s] phiên này  |  [d] từ chối"
  prompt_long:     "      Chọn [o/s/a/D]: "
  prompt_short:    "      Chọn [o/s/D]: "
  choose_smart_deny: "      [o] một lần  |  [d] từ chối"
  prompt_smart_deny: "      Chọn [o/D]: "
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ Hết giờ — đã từ chối lệnh"
  allowed_once:    "      ✓ Đã cho phép một lần"
  allowed_session: "      ✓ Đã cho phép trong phiên này"
  allowed_always:  "      ✓ Đã thêm vào danh sách cho phép vĩnh viễn"
  denied:          "      ✗ Đã từ chối"
  cancelled:       "      ✗ Đã huỷ"
  blocklist_message: "Lệnh này nằm trong danh sách chặn tuyệt đối, không thể phê duyệt."

gateway:
