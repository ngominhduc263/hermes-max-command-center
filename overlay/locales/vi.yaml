  draining:         "⏳ Đang chờ {count} agent đang chạy kết thúc trước khi khởi động lại..."
  goal_cleared:     "✓ Đã xoá mục tiêu."
  no_active_goal:   "Không có mục tiêu nào đang chạy."
  config_read_failed: "⚠️ Không đọc được config.yaml: {error}"
  config_save_failed: "⚠️ Không lưu được cấu hình: {error}"

  # /model command output -- shown after a model switch or when listing models.
  model:
    error_prefix:           "Lỗi: {error}"
    switched:               "Đã chuyển sang mô hình `{model}`"
    provider_label:         "Nhà cung cấp: {provider}"
    context_label:          "Ngữ cảnh: {tokens} token"
    max_output_label:       "Đầu ra tối đa: {tokens} token"
    cost_label:             "Chi phí: {cost}"
    capabilities_label:     "Khả năng: {capabilities}"
    prompt_caching_enabled: "Bộ nhớ đệm prompt: đang bật"
    warning_prefix:         "Cảnh báo: {warning}"
    saved_global:           "Đã lưu vào config.yaml (`--global`)"
    session_only_hint:      "_(chỉ áp dụng cho phiên này — thêm `--global` để lưu lại)_"
    current_label:          "Hiện tại: `{model}` trên {provider}"
    current_tag:            " (đang dùng)"
    more_models_suffix:     " (+{count} mô hình nữa)"
    usage_switch_model:     "`/model <tên>` — đổi mô hình"
    usage_switch_provider:  "`/model <tên> --provider <slug>` — đổi nhà cung cấp"
    usage_persist:          "`/model <tên> --global` — lưu lại"

  agents:
    header:                "🤖 **Agent và tác vụ đang chạy**"
    active_agents:         "**Agent đang chạy:** {count}"
    this_chat:             " · cuộc trò chuyện này"
    more:                  "... và {count} cái nữa"
    running_processes:     "**Tiến trình nền đang chạy:** {count}"
    async_jobs:            "**Việc bất đồng bộ của gateway:** {count}"
    background_delegations: "**Việc uỷ thác chạy nền:** {count}"
    none:                  "Không có agent hay tác vụ nào đang chạy."
    state_starting:        "đang khởi động"
    state_running:         "đang chạy"

  approve:
    no_pending:            "Không có lệnh nào đang chờ phê duyệt."
    once_singular:         "✅ Đã duyệt lệnh. Agent đang chạy tiếp..."
    once_plural:           "✅ Đã duyệt lệnh ({count} lệnh). Agent đang chạy tiếp..."
    session_singular:      "✅ Đã duyệt lệnh (duyệt mẫu lệnh này cho cả phiên). Agent đang chạy tiếp..."
    session_plural:        "✅ Đã duyệt lệnh (duyệt mẫu lệnh này cho cả phiên) ({count} lệnh). Agent đang chạy tiếp..."
    always_singular:       "✅ Đã duyệt lệnh (duyệt mẫu lệnh này vĩnh viễn). Agent đang chạy tiếp..."
    always_plural:         "✅ Đã duyệt lệnh (duyệt mẫu lệnh này vĩnh viễn) ({count} lệnh). Agent đang chạy tiếp..."

  background:
    usage:                 "Cách dùng: /bg <yêu cầu>\nVí dụ: /bg Tóm tắt các bài nổi bật trên HN hôm nay\n\nChạy yêu cầu trong một phiên riêng. Bạn cứ trò chuyện tiếp — kết quả sẽ hiện ở đây khi xong."
